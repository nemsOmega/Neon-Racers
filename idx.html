    <!-- Escenas del juego -->
    <script src="Scenes/LoadingScreen.js" defer></script>
    <script src="Scenes/MainMenu.js" defer></script>
    <script src="Scenes/Core.js" defer></script>

    <!-- Fondo decorativo (Rejilla Synthwave y Sol) -->
<div class="bg-grid"></div>
<div class="bg-sun"></div>

<!-- MARCOS DECORATIVOS HUD (NUEVO) -->

    <div class="arcade-wrapper">

        <header class="arcade-header">

            </h1>

        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="arcade-main">

            <!-- PANTALLA DE JUEGO (CANVAS + EFECTO CRT) -->
            <section class="screen-container">
                <div class="crt-overlay"></div>
                <canvas id="gameCanvas" width="800" height="600">
                    Tu navegador no soporta Canvas HTML5.
                </canvas>
            </section>

            <!-- PANEL LATERAL: Leaderboard y Controles -->
            <aside class="arcade-sidebar">
                
                <!-- Tabla de Marcadores -->
                <!--<div class="panel leaderboard-panel">
                    <h2>TOP RACERS</h2>
                    <ol class="score-list">
                        <li><span>1. ACE</span> <span>99990</span></li>
                        <li><span>2. TRON</span> <span>85400</span></li>
                        <li><span>3. REX</span> <span>72100</span></li>
                        <li><span>4. NEO</span> <span>60000</span></li>
                        <li><span>5. FLY</span> <span>45000</span></li>
                    </ol>
                </div>

                <div class="controls-panel">
                    <h2>CONTROLES</h2>
                    <ul class="controls-list", style = "list-style: none;" >

                        <li><kbd>W</kbd> / <kbd>↑</kbd> Mover arriba</li>
                        <li><kbd>S</kbd> / <kbd>↓</kbd> Mover abajo</li>
                        <li><kbd>A</kbd> / <kbd>←</kbd> Mover izquierda</li>
                        <li><kbd>D</kbd> / <kbd>→</kbd> Mover derecha</li></ul>
                    </ul>
                </div>

                <!-- Control de Sonido -->
                <!--<div class="panel audio-panel">
                    <button id="btn-audio" class="neon-btn">

                    </button>
                </div>

        </main>

        <footer class="arcade-footer">
            <p>© 2026 RED MAPLE GAMES | ALL RIGHTS RESERVED</p>
            <p class="blink-text">PRESS START TO PLAY</p>
        </footer>
